<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Bench Gradient -->
    <linearGradient id="benchBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A241E" />
      <stop offset="100%" stop-color="#0E1612" />
    </linearGradient>

    <!-- Metallic Meters Gradient -->
    <linearGradient id="meterBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#171923" />
    </linearGradient>

    <linearGradient id="meterDial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <linearGradient id="meterRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#718096" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Rheostat Gradient -->
    <linearGradient id="rheoCoil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B341E" />
      <stop offset="25%" stop-color="#C05621" />
      <stop offset="50%" stop-color="#ED8936" />
      <stop offset="75%" stop-color="#C05621" />
      <stop offset="100%" stop-color="#7B341E" />
    </linearGradient>

    <!-- Battery Eliminator Gradient -->
    <linearGradient id="batteryBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="100%" stop-color="#1D4044" />
    </linearGradient>

    <!-- Shadows & Glow -->
    <filter id="meterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="wireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lab Bench Background -->
  <rect width="800" height="450" fill="url(#benchBg)" />

  <!-- Grid lines on lab desk -->
  <g opacity="0.07" stroke="#68D391" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Desk Surface Highlight / Matte Wooden Bench mat -->
  <rect x="40" y="80" width="720" height="340" rx="16" fill="#141E18" stroke="#233527" stroke-width="1.5" />

  <!-- ================= APPARATUS 1: DC BATTERY ELIMINATOR (Top Left) ================= -->
  <g transform="translate(70, 110)" filter="url(#meterShadow)">
    <rect width="130" height="110" rx="10" fill="url(#batteryBody)" stroke="#4FD1C5" stroke-width="1.5" />
    <!-- Grill and label -->
    <rect x="15" y="15" width="100" height="24" rx="4" fill="#0E2325" />
    <text x="25" y="31" font-family="monospace" font-size="10" font-weight="bold" fill="#81E6D9">DC 0-6V SUPPLY</text>
    
    <!-- Rotary dial -->
    <circle cx="45" cy="75" r="18" fill="#1A202C" stroke="#718096" stroke-width="1.5" />
    <circle cx="45" cy="75" r="6" fill="#4FD1C5" />
    <line x1="45" y1="75" x2="55" y2="65" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Output Terminals -->
    <!-- Positive Red (+) -->
    <circle cx="95" cy="65" r="8" fill="#E53E3E" stroke="#742A2A" stroke-width="2" />
    <circle cx="95" cy="65" r="3" fill="#FF8787" />
    <text x="108" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E53E3E">+</text>

    <!-- Negative Black (-) -->
    <circle cx="95" cy="92" r="8" fill="#1A202C" stroke="#4A5568" stroke-width="2" />
    <circle cx="95" cy="92" r="3" fill="#A0AEC0" />
    <text x="108" y="97" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A0AEC0">-</text>
  </g>

  <!-- ================= APPARATUS 2: DC AMMETER (Center-Left) ================= -->
  <g transform="translate(230, 105)" filter="url(#meterShadow)">
    <!-- Base block -->
    <rect width="120" height="135" rx="12" fill="url(#meterBody)" stroke="url(#meterRim)" stroke-width="2" />
    
    <!-- Dial face -->
    <ellipse cx="60" cy="65" rx="46" ry="46" fill="url(#meterDial)" stroke="#CBD5E0" stroke-width="1" />
    
    <!-- Calibration scale arc -->
    <path d="M 28,78 A 36 36 0 0 1 92,78" fill="none" stroke="#2D3748" stroke-width="2" />
    <!-- Ticks -->
    <line x1="28" y1="78" x2="34" y2="72" stroke="#2D3748" stroke-width="1.5" />
    <line x1="42" y1="52" x2="46" y2="58" stroke="#2D3748" stroke-width="1.5" />
    <line x1="60" y1="42" x2="60" y2="48" stroke="#E53E3E" stroke-width="2" />
    <line x1="78" y1="52" x2="74" y2="58" stroke="#2D3748" stroke-width="1.5" />
    <line x1="92" y1="78" x2="86" y2="72" stroke="#2D3748" stroke-width="1.5" />

    <!-- Deflected Needle to ~ 240 mA -->
    <line x1="60" y1="76" x2="72" y2="46" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="76" r="5" fill="#1A202C" />

    <!-- Big 'A' symbol -->
    <text x="54" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D3748">A</text>
    <text x="36" y="108" font-family="sans-serif" font-size="8" fill="#718096">0 - 500 mA</text>

    <!-- Terminals on base -->
    <circle cx="35" cy="120" r="6" fill="#E53E3E" stroke="#1A202C" stroke-width="1.5" />
    <circle cx="85" cy="120" r="6" fill="#1A202C" stroke="#718096" stroke-width="1.5" />
  </g>

  <!-- ================= APPARATUS 3: DC VOLTMETER (Center-Right) ================= -->
  <g transform="translate(380, 105)" filter="url(#meterShadow)">
    <!-- Base block -->
    <rect width="120" height="135" rx="12" fill="url(#meterBody)" stroke="url(#meterRim)" stroke-width="2" />
    
    <!-- Dial face -->
    <ellipse cx="60" cy="65" rx="46" ry="46" fill="url(#meterDial)" stroke="#CBD5E0" stroke-width="1" />
    
    <!-- Calibration scale arc -->
    <path d="M 28,78 A 36 36 0 0 1 92,78" fill="none" stroke="#2D3748" stroke-width="2" />
    <!-- Ticks -->
    <line x1="28" y1="78" x2="34" y2="72" stroke="#2D3748" stroke-width="1.5" />
    <line x1="42" y1="52" x2="46" y2="58" stroke="#2D3748" stroke-width="1.5" />
    <line x1="60" y1="42" x2="60" y2="48" stroke="#E53E3E" stroke-width="2" />
    <line x1="78" y1="52" x2="74" y2="58" stroke="#2D3748" stroke-width="1.5" />
    <line x1="92" y1="78" x2="86" y2="72" stroke="#2D3748" stroke-width="1.5" />

    <!-- Deflected Needle to ~ 2.4 V -->
    <line x1="60" y1="76" x2="72" y2="46" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="76" r="5" fill="#1A202C" />

    <!-- Big 'V' symbol -->
    <text x="55" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D3748">V</text>
    <text x="44" y="108" font-family="sans-serif" font-size="8" fill="#718096">0 - 5 V</text>

    <!-- Terminals on base -->
    <circle cx="35" cy="120" r="6" fill="#E53E3E" stroke="#1A202C" stroke-width="1.5" />
    <circle cx="85" cy="120" r="6" fill="#1A202C" stroke="#718096" stroke-width="1.5" />
  </g>

  <!-- ================= APPARATUS 4: UNKNOWN RESISTANCE COIL (Bottom-Left) ================= -->
  <g transform="translate(250, 290)" filter="url(#meterShadow)">
    <!-- Wooden base plate -->
    <rect width="110" height="70" rx="8" fill="#5C3A21" stroke="#3B2313" stroke-width="1.5" />
    <!-- Bobbin coil -->
    <rect x="25" y="15" width="60" height="40" rx="6" fill="#2D3748" />
    <!-- Fine nichrome windings lines -->
    <line x1="30" y1="20" x2="80" y2="20" stroke="#CBD5E0" stroke-width="1" />
    <line x1="30" y1="26" x2="80" y2="26" stroke="#ED8936" stroke-width="1" />
    <line x1="30" y1="32" x2="80" y2="32" stroke="#CBD5E0" stroke-width="1" />
    <line x1="30" y1="38" x2="80" y2="38" stroke="#ED8936" stroke-width="1" />
    <line x1="30" y1="44" x2="80" y2="44" stroke="#CBD5E0" stroke-width="1" />
    <line x1="30" y1="50" x2="80" y2="50" stroke="#ED8936" stroke-width="1" />
    <!-- Terminals -->
    <circle cx="15" cy="35" r="5" fill="#D69E2E" stroke="#744210" stroke-width="1.5" />
    <circle cx="95" cy="35" r="5" fill="#D69E2E" stroke="#744210" stroke-width="1.5" />
    <text x="32" y="65" font-family="monospace" font-size="9" font-weight="bold" fill="#FBD38D">RESISTOR R</text>
  </g>

  <!-- ================= APPARATUS 5: SLIDE-WIRE RHEOSTAT (Bottom-Right) ================= -->
  <g transform="translate(420, 295)" filter="url(#meterShadow)">
    <!-- End brackets -->
    <rect x="0" y="5" width="16" height="55" rx="3" fill="#2D3748" stroke="#4A5568" stroke-width="1" />
    <rect x="174" y="5" width="16" height="55" rx="3" fill="#2D3748" stroke="#4A5568" stroke-width="1" />
    
    <!-- Ceramic Tube with Wound Constantan Wire -->
    <rect x="16" y="12" width="158" height="42" rx="4" fill="url(#rheoCoil)" stroke="#744210" stroke-width="1" />

    <!-- Top Slider Guide Rod -->
    <rect x="6" y="4" width="178" height="6" rx="2" fill="#E2E8F0" stroke="#A0AEC0" stroke-width="1" />

    <!-- Wiper Slider Contact -->
    <rect x="85" y="-2" width="22" height="20" rx="3" fill="#2B6CB0" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="96" cy="7" r="4" fill="#D69E2E" />

    <!-- Terminals -->
    <circle cx="8" cy="55" r="5" fill="#D69E2E" stroke="#744210" stroke-width="1" />
    <circle cx="182" cy="55" r="5" fill="#D69E2E" stroke="#744210" stroke-width="1" />
    <circle cx="96" cy="-6" r="4" fill="#D69E2E" stroke="#744210" stroke-width="1" />
    <text x="65" y="72" font-family="monospace" font-size="9" font-weight="bold" fill="#ED8936">RHEOSTAT (Rh)</text>
  </g>

  <!-- ================= APPARATUS 6: PLUG KEY (Bottom Left) ================= -->
  <g transform="translate(100, 305)" filter="url(#meterShadow)">
    <rect width="70" height="45" rx="6" fill="#4A5568" stroke="#2D3748" stroke-width="1.5" />
    <!-- Brass blocks -->
    <rect x="12" y="12" width="20" height="22" rx="2" fill="#D69E2E" stroke="#744210" stroke-width="1" />
    <rect x="38" y="12" width="20" height="22" rx="2" fill="#D69E2E" stroke="#744210" stroke-width="1" />
    <!-- Taper Plug inserted -->
    <ellipse cx="35" cy="23" rx="4" ry="7" fill="#1A202C" stroke="#ECC94B" stroke-width="1.5" />
    <text x="18" y="42" font-family="monospace" font-size="8" font-weight="bold" fill="#F6E05E">KEY (K)</text>
  </g>

  <!-- ================= CONNECTING WIRES (Circuit Schematic Implementation) ================= -->
  <!-- Wire 1: Battery (+) to Plug Key (Red) -->
  <path d="M 165,175 C 190,175 190,325 112,325" fill="none" stroke="#E53E3E" stroke-width="3.5" filter="url(#wireGlow)" stroke-linecap="round" />
  
  <!-- Wire 2: Plug Key to Rheostat lower terminal (Black) -->
  <path d="M 158,325 C 200,380 390,370 428,350" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" />
  
  <!-- Wire 3: Rheostat slider to Resistor (Black) -->
  <path d="M 516,289 C 520,250 365,270 345,325" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" />

  <!-- Wire 4: Resistor to Ammeter (-) (Red) -->
  <path d="M 265,325 C 240,320 280,260 265,225" fill="none" stroke="#E53E3E" stroke-width="3.5" filter="url(#wireGlow)" stroke-linecap="round" />

  <!-- Wire 5: Ammeter (+) to Battery (-) (completes series loop) -->
  <path d="M 315,225 C 330,260 210,210 165,202" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" />

  <!-- Voltmeter across Resistor in Parallel -->
  <!-- Parallel connection 1: Resistor left to Voltmeter (+) -->
  <path d="M 265,325 C 290,300 370,250 415,225" fill="none" stroke="#E53E3E" stroke-width="2.5" stroke-dasharray="6,3" stroke-linecap="round" />
  <!-- Parallel connection 2: Resistor right to Voltmeter (-) -->
  <path d="M 345,325 C 370,300 450,260 465,225" fill="none" stroke="#2D3748" stroke-width="2.5" stroke-dasharray="6,3" stroke-linecap="round" />

  <!-- ================= V-I GRAPH MONITOR HUD (Top Right) ================= -->
  <g transform="translate(540, 105)" filter="url(#meterShadow)">
    <!-- Monitor Bezel -->
    <rect width="190" height="150" rx="10" fill="#17231B" stroke="#B8D96B" stroke-width="1.5" />
    
    <!-- Screen Header -->
    <rect x="0" y="0" width="190" height="26" rx="10" fill="#203325" />
    <text x="12" y="17" font-family="monospace" font-size="9" font-weight="bold" fill="#B8D96B">V-I LINEAR PLOT</text>
    
    <!-- Screen Coordinate Axes -->
    <g transform="translate(35, 125)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="135" y2="0" stroke="#718096" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="-85" stroke="#718096" stroke-width="1.5" />
      <!-- Arrowheads -->
      <polygon points="135,0 128,-3 128,3" fill="#718096" />
      <polygon points="0,-85 -3,-78 3,-78" fill="#718096" />
      <text x="110" y="14" font-family="monospace" font-size="9" fill="#A0AEC0">I (mA)</text>
      <text x="-25" y="-72" font-family="monospace" font-size="9" fill="#A0AEC0">V (V)</text>

      <!-- Linear Ohm's Law Slope (Straight line through origin) -->
      <line x1="0" y1="0" x2="120" y2="-75" stroke="#B8D96B" stroke-width="2.5" filter="url(#wireGlow)" />
      
      <!-- Experimental Data Points -->
      <circle cx="30" cy="-18" r="3" fill="#FFFFFF" />
      <circle cx="60" cy="-38" r="3" fill="#FFFFFF" />
      <circle cx="90" cy="-56" r="3" fill="#FFFFFF" />
      <circle cx="120" cy="-75" r="3" fill="#FFFFFF" />

      <!-- Formula callout -->
      <text x="25" y="-55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#B8D96B">Slope = R = ΔV / ΔI</text>
    </g>
  </g>
</svg>
