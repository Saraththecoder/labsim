<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A22" />
      <stop offset="100%" stop-color="#0F1712" />
    </linearGradient>

    <!-- Board Texture -->
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBE3D5" />
      <stop offset="100%" stop-color="#DCD2C0" />
    </linearGradient>

    <!-- Glass Slab 3D Fill -->
    <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A7D8DE" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#C2EBF0" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8AC7CE" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glassFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9EA6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A757D" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B868D" />
      <stop offset="100%" stop-color="#2D5A60" />
    </linearGradient>

    <!-- Laser Beam Glow -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2A4D" />
      <stop offset="100%" stop-color="#FF5E7E" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Lab Table -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Lab Grid in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Drawing Sheet on Table -->
  <g filter="url(#cardShadow)">
    <polygon points="120,70 710,70 680,400 90,400" fill="url(#boardGrad)" stroke="#B3A895" stroke-width="1.5" />
    <!-- Drawing pins at corners -->
    <circle cx="140" cy="90" r="7" fill="#C53030" stroke="#742A2A" stroke-width="1.5" />
    <circle cx="690" cy="90" r="7" fill="#C53030" stroke="#742A2A" stroke-width="1.5" />
    <circle cx="660" cy="380" r="7" fill="#C53030" stroke="#742A2A" stroke-width="1.5" />
    <circle cx="110" cy="380" r="7" fill="#C53030" stroke="#742A2A" stroke-width="1.5" />
  </g>

  <!-- Normal Line at Interface 1 (Top) -->
  <line x1="320" y1="120" x2="320" y2="250" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- Normal Line at Interface 2 (Bottom) -->
  <line x1="375" y1="230" x2="375" y2="360" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Dotted Undeviated Ray Path -->
  <line x1="160" y1="100" x2="520" y2="390" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- Glass Slab (Isometric 3D) -->
  <!-- Bottom shadow -->
  <polygon points="220,180 580,180 560,300 200,300" fill="#000000" opacity="0.25" filter="blur(8px)" />
  
  <!-- Front Edge -->
  <polygon points="200,280 560,280 560,300 200,300" fill="url(#glassFront)" />
  <!-- Right Edge -->
  <polygon points="560,180 580,165 580,285 560,300" fill="url(#glassSide)" />
  <!-- Main Glass Slab Top Surface -->
  <polygon points="220,165 580,165 560,280 200,280" fill="url(#glassTop)" stroke="#E2F8FA" stroke-width="1.5" />
  
  <!-- Glass Internal Reflections & Highlight -->
  <polygon points="230,175 570,175 555,190 245,190" fill="#FFFFFF" opacity="0.4" />
  <line x1="220" y1="165" x2="200" y2="280" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />

  <!-- Laser Source Box -->
  <g transform="translate(110, 70) rotate(39)">
    <rect x="-15" y="-12" width="60" height="24" rx="4" fill="#2D3748" stroke="#4A5568" stroke-width="1.5" />
    <rect x="45" y="-4" width="10" height="8" rx="2" fill="#E53E3E" />
    <circle cx="5" cy="0" r="3" fill="#B8D96B" />
  </g>

  <!-- LASER RAYS (Glowing Red) -->
  <!-- 1. Incident Ray: (160, 100) -> (320, 228) -->
  <line x1="160" y1="100" x2="320" y2="228" stroke="url(#laserGrad)" stroke-width="3" filter="url(#laserGlow)" />
  <line x1="160" y1="100" x2="320" y2="228" stroke="#FFFFFF" stroke-width="1" />

  <!-- 2. Refracted Ray inside Glass: (320, 228) -> (375, 290) -->
  <line x1="320" y1="228" x2="375" y2="290" stroke="url(#laserGrad)" stroke-width="3.5" filter="url(#laserGlow)" />
  <line x1="320" y1="228" x2="375" y2="290" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- 3. Emergent Ray: (375, 290) -> (535, 418) parallel to incident ray -->
  <line x1="375" y1="290" x2="535" y2="418" stroke="url(#laserGrad)" stroke-width="3" filter="url(#laserGlow)" />
  <line x1="375" y1="290" x2="535" y2="418" stroke="#FFFFFF" stroke-width="1" />

  <!-- Lateral Displacement Indicator 'd' -->
  <line x1="480" y1="358" x2="455" y2="388" stroke="#FFD700" stroke-width="2" stroke-linecap="round" />
  <polygon points="483,354 473,358 480,366" fill="#FFD700" />
  <polygon points="452,392 462,388 455,380" fill="#FFD700" />
  <text x="480" y="388" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFD700">d (Lateral Shift)</text>

  <!-- Angle Arcs -->
  <!-- Angle of Incidence i -->
  <path d="M 320,180 A 48 48 0 0 0 285,199" fill="none" stroke="#2B6CB0" stroke-width="1.8" />
  <text x="290" y="188" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B6CB0">∠i</text>

  <!-- Angle of Refraction r -->
  <path d="M 320,255 A 30 30 0 0 0 338,249" fill="none" stroke="#2B6CB0" stroke-width="1.8" />
  <text x="328" y="266" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2B6CB0">∠r</text>

  <!-- Angle of Emergence e -->
  <path d="M 375,325 A 36 36 0 0 0 410,318" fill="none" stroke="#2B6CB0" stroke-width="1.8" />
  <text x="388" y="336" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B6CB0">∠e</text>

  <!-- Optical Pins (P1, P2, P3, P4) -->
  <!-- Pin 1 -->
  <circle cx="195" cy="128" r="4" fill="#E2E8F0" stroke="#1A202C" stroke-width="1.5" />
  <text x="180" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D3748">P₁</text>
  <!-- Pin 2 -->
  <circle cx="260" cy="180" r="4" fill="#E2E8F0" stroke="#1A202C" stroke-width="1.5" />
  <text x="245" y="176" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D3748">P₂</text>
  <!-- Pin 3 -->
  <circle cx="420" cy="326" r="4" fill="#E2E8F0" stroke="#1A202C" stroke-width="1.5" />
  <text x="430" y="330" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D3748">P₃</text>
  <!-- Pin 4 -->
  <circle cx="490" cy="382" r="4" fill="#E2E8F0" stroke="#1A202C" stroke-width="1.5" />
  <text x="500" y="386" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D3748">P₄</text>

  <!-- Overlay HUD Tag -->
  <g transform="translate(480, 85)">
    <rect width="210" height="42" rx="8" fill="#17231B" fill-opacity="0.88" stroke="#B8D96B" stroke-width="1" />
    <text x="12" y="18" font-family="monospace" font-size="10" font-weight="bold" fill="#B8D96B">SNELL'S LAW VERIFIED</text>
    <text x="12" y="32" font-family="sans-serif" font-size="11" fill="#FFFFFF">n = sin(i) / sin(r) ≈ 1.52</text>
  </g>
</svg>
