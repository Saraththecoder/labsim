<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="scopeMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="60%" stop-color="#319795" />
      <stop offset="100%" stop-color="#234E52" />
    </linearGradient>

    <linearGradient id="scopeChrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>

    <filter id="scopeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#scopeGlow)">
    <!-- Base Plate -->
    <ellipse cx="60" cy="104" rx="36" ry="10" fill="#2D3748" />
    <ellipse cx="60" cy="102" rx="34" ry="8" fill="#4A5568" />
    
    <!-- Curved Arm -->
    <path d="M 68,98 C 68,98 84,94 88,78 C 92,62 88,40 70,36 L 68,44 C 80,48 82,64 80,76 C 78,86 68,90 68,90 Z" fill="url(#scopeMetal)" />

    <!-- Eyepiece Tube (Tilted 30 deg) -->
    <g transform="translate(56, 36) rotate(-25)">
      <!-- Eyepiece Lens Cup -->
      <rect x="-7" y="-22" width="14" height="6" rx="2" fill="#2D3748" />
      <!-- Top Chrome Tube -->
      <rect x="-5" y="-16" width="10" height="20" rx="1" fill="url(#scopeChrome)" />
      <!-- Body Tube -->
      <rect x="-8" y="4" width="16" height="30" rx="3" fill="url(#scopeMetal)" />
      <!-- Revolving Nosepiece / Turret -->
      <ellipse cx="0" cy="34" rx="12" ry="5" fill="#2D3748" />
      <!-- Objective Lenses (3 objectives) -->
      <rect x="-9" y="38" width="5" height="12" rx="1" fill="url(#scopeChrome)" />
      <rect x="-2" y="38" width="5" height="16" rx="1" fill="#ECC94B" />
      <rect x="5" y="38" width="4" height="10" rx="1" fill="url(#scopeChrome)" />
    </g>

    <!-- Stage Platform -->
    <rect x="30" y="70" width="36" height="6" rx="2" fill="#2D3748" stroke="#1A202C" stroke-width="1" />
    <!-- Glass Slide on Stage -->
    <rect x="36" y="68" width="24" height="3" rx="1" fill="#81E6D9" opacity="0.85" />
    <!-- Slide Cover Slip -->
    <rect x="46" y="67" width="6" height="2" fill="#E6FFFA" />

    <!-- Substage Condenser & Light Beam -->
    <rect x="42" y="80" width="12" height="8" rx="2" fill="url(#scopeChrome)" />
    <!-- Glowing yellow light beam from illuminator to slide -->
    <polygon points="44,80 52,80 50,72 46,72" fill="#F6E05E" opacity="0.8" />

    <!-- Coarse & Fine Focus Adjustment Knobs on Arm -->
    <circle cx="82" cy="72" r="7" fill="url(#scopeChrome)" stroke="#4A5568" stroke-width="1" />
    <circle cx="82" cy="72" r="3.5" fill="#2D3748" />

    <!-- Sparkles -->
    <path d="M 28,40 Q 31,40 31,37 Q 31,40 34,40 Q 31,40 31,43 Q 31,40 28,40 Z" fill="#F6E05E" />
    <path d="M 98,34 Q 101,34 101,31 Q 101,34 104,34 Q 101,34 101,37 Q 101,34 98,34 Z" fill="#81E6D9" />
  </g>
</svg>
