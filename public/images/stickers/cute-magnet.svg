<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Red North Pole Gradient -->
    <linearGradient id="northGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FC8181" />
      <stop offset="40%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#9B2C2C" />
    </linearGradient>

    <!-- Blue South Pole Gradient -->
    <linearGradient id="southGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63B3ED" />
      <stop offset="40%" stop-color="#3182CE" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>

    <!-- Silver Pole Tips -->
    <linearGradient id="silverTip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDF2F7" />
      <stop offset="50%" stop-color="#CBD5E0" />
      <stop offset="100%" stop-color="#A0AEC0" />
    </linearGradient>

    <filter id="magnetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#magnetGlow)">
    <!-- Magnetic Flux Arcs between poles -->
    <path d="M 38,92 C 38,110 82,110 82,92" fill="none" stroke="#F6E05E" stroke-width="2" stroke-dasharray="4,4" opacity="0.85" />
    <path d="M 34,92 C 34,118 86,118 86,92" fill="none" stroke="#B8D96B" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.65" />

    <!-- Horseshoe U-Shape Body -->
    <!-- Base Curved Back (Top) -->
    <path d="M 24,65 C 24,35 40,20 60,20 C 80,20 96,35 96,65 L 96,78 L 74,78 L 74,65 C 74,50 68,42 60,42 C 52,42 46,50 46,65 L 46,78 L 24,78 Z" 
          fill="#E53E3E" />

    <!-- Split Colors: Left Red (North), Right Blue (South) -->
    <!-- Left Leg (North Pole) -->
    <path d="M 24,65 C 24,35 40,20 60,20 L 60,42 C 52,42 46,50 46,65 L 46,78 L 24,78 Z" fill="url(#northGrad)" />
    
    <!-- Right Leg (South Pole) -->
    <path d="M 60,20 C 80,20 96,35 96,65 L 96,78 L 74,78 L 74,65 C 74,50 68,42 60,42 Z" fill="url(#southGrad)" />

    <!-- Silver Pole Caps -->
    <!-- Left Cap (N) -->
    <rect x="24" y="78" width="22" height="14" rx="2" fill="url(#silverTip)" stroke="#A0AEC0" stroke-width="1" />
    <!-- Right Cap (S) -->
    <rect x="74" y="78" width="22" height="14" rx="2" fill="url(#silverTip)" stroke="#A0AEC0" stroke-width="1" />

    <!-- Glossy Specular Highlight Curve -->
    <path d="M 30,68 C 30,42 42,28 60,28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65" />

    <!-- Pole Labels: 'N' and 'S' -->
    <text x="31" y="65" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">N</text>
    <text x="81" y="65" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">S</text>

    <!-- Sparkles -->
    <path d="M 16,30 Q 19,30 19,27 Q 19,30 22,30 Q 19,30 19,33 Q 19,30 16,30 Z" fill="#F6E05E" />
    <path d="M 104,40 Q 107,40 107,37 Q 107,40 110,40 Q 107,40 107,43 Q 107,40 104,40 Z" fill="#63B3ED" />
  </g>
</svg>
