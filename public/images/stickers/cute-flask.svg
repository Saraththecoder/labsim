<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Liquid Gradient -->
    <linearGradient id="flaskLiquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="60%" stop-color="#319795" />
      <stop offset="100%" stop-color="#234E52" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E6FFFA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6" />
    </linearGradient>

    <filter id="flaskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#flaskGlow)">
    <!-- Flask Glass Body -->
    <path d="M 52,18 L 68,18 L 68,40 L 96,92 C 99,98 94,104 88,104 L 32,104 C 26,104 21,98 24,92 L 52,40 Z" 
          fill="#FFFFFF" fill-opacity="0.3" stroke="#CBD5E0" stroke-width="3" stroke-linejoin="round" />

    <!-- Liquid inside Flask -->
    <path d="M 44,56 L 76,56 L 94,92 C 96,96 93,101 88,101 L 32,101 C 27,101 24,96 26,92 Z" 
          fill="url(#flaskLiquid)" />

    <!-- Liquid Meniscus Surface Curve -->
    <ellipse cx="60" cy="56" rx="16" ry="3.5" fill="#81E6D9" />

    <!-- Bubbles rising in liquid -->
    <circle cx="50" cy="88" r="4.5" fill="#E6FFFA" opacity="0.85" />
    <circle cx="51.5" cy="87" r="1.5" fill="#FFFFFF" />

    <circle cx="70" cy="78" r="3.5" fill="#E6FFFA" opacity="0.9" />
    <circle cx="71" cy="77" r="1.2" fill="#FFFFFF" />

    <circle cx="56" cy="68" r="3" fill="#E6FFFA" opacity="0.8" />

    <circle cx="64" cy="94" r="2.5" fill="#E6FFFA" opacity="0.75" />

    <!-- Rising escaped bubble above liquid -->
    <circle cx="62" cy="42" r="3.5" fill="#81E6D9" opacity="0.85" />
    <circle cx="58" cy="28" r="2.5" fill="#B2F5EA" opacity="0.75" />
    <circle cx="66" cy="12" r="2" fill="#E6FFFA" opacity="0.85" />

    <!-- Glass Measurement Ticks -->
    <line x1="42" y1="66" x2="48" y2="66" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" stroke-linecap="round" />
    <line x1="38" y1="76" x2="45" y2="76" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" stroke-linecap="round" />
    <line x1="33" y1="86" x2="42" y2="86" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" stroke-linecap="round" />

    <!-- Curved Specular Glass Glare -->
    <path d="M 30,90 L 53,46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 28,94 L 34,100" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Flask Rim Top -->
    <rect x="49" y="14" width="22" height="6" rx="3" fill="url(#glassSheen)" stroke="#CBD5E0" stroke-width="1.5" />

    <!-- Cute Sparkle -->
    <path d="M 88,48 Q 92,48 92,44 Q 92,48 96,48 Q 92,48 92,52 Q 92,48 88,48 Z" fill="#38B2AC" />
    <path d="M 22,35 Q 25,35 25,32 Q 25,35 28,35 Q 25,35 25,38 Q 25,35 22,35 Z" fill="#F6E05E" />
  </g>
</svg>
