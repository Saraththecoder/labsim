<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Nucleus Gradient -->
    <radialGradient id="nucGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#B8D96B" />
      <stop offset="85%" stop-color="#6E9A28" />
      <stop offset="100%" stop-color="#3D5A12" />
    </radialGradient>

    <!-- Electron Glow -->
    <radialGradient id="elecGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38B2AC" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>

    <filter id="stickerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>

    <linearGradient id="ringGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8D96B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38B2AC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#B8D96B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#805AD5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="ringGrad3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6E05E" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ED8936" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B8D96B" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerGlow)">
    <!-- Orbit 1 (Rotated 30 deg) -->
    <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="url(#ringGrad1)" stroke-width="3" transform="rotate(30 60 60)" />

    <!-- Orbit 2 (Rotated 90 deg) -->
    <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="url(#ringGrad2)" stroke-width="3" transform="rotate(90 60 60)" />

    <!-- Orbit 3 (Rotated 150 deg) -->
    <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="url(#ringGrad3)" stroke-width="3" transform="rotate(150 60 60)" />

    <!-- Orbiting Electrons (3D Spheres with Highlights) -->
    <!-- Electron 1 on Orbit 1 -->
    <g transform="translate(98, 82)">
      <circle cx="0" cy="0" r="6" fill="url(#elecGrad)" />
      <circle cx="-1.5" cy="-1.5" r="2" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Electron 2 on Orbit 2 -->
    <g transform="translate(60, 14)">
      <circle cx="0" cy="0" r="6" fill="url(#elecGrad)" />
      <circle cx="-1.5" cy="-1.5" r="2" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Electron 3 on Orbit 3 -->
    <g transform="translate(22, 82)">
      <circle cx="0" cy="0" r="6" fill="url(#elecGrad)" />
      <circle cx="-1.5" cy="-1.5" r="2" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Central Glowing 3D Nucleus -->
    <circle cx="60" cy="60" r="16" fill="url(#nucGrad)" />
    <!-- Nucleus Specular Highlight -->
    <ellipse cx="55" cy="54" rx="6" ry="4" fill="#FFFFFF" opacity="0.85" />
    <circle cx="66" cy="64" r="2" fill="#FFFFFF" opacity="0.4" />

    <!-- Sparkle Stars -->
    <path d="M 20,25 Q 24,25 24,21 Q 24,25 28,25 Q 24,25 24,29 Q 24,25 20,25 Z" fill="#F6E05E" />
    <path d="M 94,30 Q 97,30 97,27 Q 97,30 100,30 Q 97,30 97,33 Q 97,30 94,30 Z" fill="#B8D96B" />
  </g>
</svg>
