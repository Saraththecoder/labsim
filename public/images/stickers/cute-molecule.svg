<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Oxygen Atom (Red) -->
    <radialGradient id="oxygenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEB2B2" />
      <stop offset="35%" stop-color="#E53E3E" />
      <stop offset="85%" stop-color="#9B2C2C" />
      <stop offset="100%" stop-color="#63171B" />
    </radialGradient>

    <!-- Hydrogen Atom (White/Silver) -->
    <radialGradient id="hydroGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#A0AEC0" />
      <stop offset="100%" stop-color="#718096" />
    </radialGradient>

    <!-- Bond Cylinder Gradient -->
    <linearGradient id="bondGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E0" />
      <stop offset="100%" stop-color="#A0AEC0" />
    </linearGradient>

    <filter id="molGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#molGlow)">
    <!-- Covalent Bond Cylinders -->
    <!-- Left Bond to H1 -->
    <line x1="60" y1="62" x2="30" y2="34" stroke="url(#bondGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Right Bond to H2 -->
    <line x1="60" y1="62" x2="90" y2="34" stroke="url(#bondGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- 104.5 Angle Arc Indicator -->
    <path d="M 44,48 A 20 20 0 0 1 76,48" fill="none" stroke="#F6E05E" stroke-width="2" stroke-dasharray="3,3" />
    <text x="60" y="44" font-family="sans-serif" font-size="7" font-weight="bold" fill="#D69E2E" text-anchor="middle">104.5°</text>

    <!-- Left Hydrogen Sphere (H1) -->
    <circle cx="28" cy="32" r="15" fill="url(#hydroGrad)" />
    <ellipse cx="23" cy="27" rx="5" ry="3" fill="#FFFFFF" opacity="0.9" />
    <text x="28" y="37" font-family="sans-serif" font-size="12" font-weight="900" fill="#4A5568" text-anchor="middle">H</text>

    <!-- Right Hydrogen Sphere (H2) -->
    <circle cx="92" cy="32" r="15" fill="url(#hydroGrad)" />
    <ellipse cx="87" cy="27" rx="5" ry="3" fill="#FFFFFF" opacity="0.9" />
    <text x="92" y="37" font-family="sans-serif" font-size="12" font-weight="900" fill="#4A5568" text-anchor="middle">H</text>

    <!-- Central Big Oxygen Sphere (O) -->
    <circle cx="60" cy="72" r="24" fill="url(#oxygenGrad)" />
    <!-- Specular Highlight -->
    <ellipse cx="52" cy="62" rx="9" ry="5.5" transform="rotate(-25 52 62)" fill="#FFFFFF" opacity="0.85" />
    <circle cx="68" cy="78" r="2.5" fill="#FFFFFF" opacity="0.4" />
    <text x="60" y="80" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">O</text>

    <!-- Sparkles -->
    <path d="M 96,68 Q 99,68 99,65 Q 99,68 102,68 Q 99,68 99,71 Q 99,68 96,68 Z" fill="#F6E05E" />
    <path d="M 16,60 Q 19,60 19,57 Q 19,60 22,60 Q 19,60 19,63 Q 19,60 16,60 Z" fill="#63B3ED" />
  </g>
</svg>
