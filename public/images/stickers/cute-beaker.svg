<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Liquid Gradient -->
    <linearGradient id="beakerLiquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F7AEA" />
      <stop offset="50%" stop-color="#667EEA" />
      <stop offset="100%" stop-color="#4C51BF" />
    </linearGradient>

    <filter id="beakerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#beakerGlow)">
    <!-- Beaker Glass Outline with Spout on Left -->
    <path d="M 22,22 L 30,28 L 30,94 C 30,102 36,106 44,106 L 76,106 C 84,106 90,102 90,94 L 90,28 L 94,22" 
          fill="#FFFFFF" fill-opacity="0.3" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Liquid Fill -->
    <path d="M 31,52 L 89,52 L 89,94 C 89,101 84,104 77,104 L 43,104 C 36,104 31,101 31,94 Z" 
          fill="url(#beakerLiquid)" />

    <!-- Meniscus Liquid Top -->
    <ellipse cx="60" cy="52" rx="29" ry="5" fill="#B794F4" />

    <!-- Graduation Marks -->
    <line x1="32" y1="62" x2="42" y2="62" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="32" y1="74" x2="40" y2="74" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="32" y1="86" x2="42" y2="86" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="32" y1="98" x2="38" y2="98" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Cute Floating Dissociated Ions inside Liquid -->
    <!-- Positive Ion: Na+ -->
    <g transform="translate(48, 70)">
      <circle cx="0" cy="0" r="9" fill="#ED8936" />
      <circle cx="-2" cy="-2" r="3" fill="#FEEBC8" opacity="0.8" />
      <text x="0" y="3.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Na⁺</text>
    </g>

    <!-- Negative Ion: Cl- -->
    <g transform="translate(72, 85)">
      <circle cx="0" cy="0" r="10" fill="#38B2AC" />
      <circle cx="-2.5" cy="-2.5" r="3.5" fill="#E6FFFA" opacity="0.8" />
      <text x="0" y="3.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cl⁻</text>
    </g>

    <!-- Hydrogen Ion: H+ -->
    <g transform="translate(56, 94)">
      <circle cx="0" cy="0" r="6" fill="#F56565" />
      <circle cx="-1.5" cy="-1.5" r="2" fill="#FED7D7" opacity="0.8" />
      <text x="0" y="2.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">H⁺</text>
    </g>

    <!-- Glass Specular Reflection on Right -->
    <path d="M 84,36 L 84,90" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Sparkles -->
    <path d="M 76,28 Q 79,28 79,25 Q 79,28 82,28 Q 79,28 79,31 Q 79,28 76,28 Z" fill="#D6BCFA" />
    <path d="M 18,78 Q 21,78 21,75 Q 21,78 24,78 Q 21,78 21,81 Q 21,78 18,78 Z" fill="#68D391" />
  </g>
</svg>
