<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 120" width="100%" height="100%">
  <defs>
    <!-- Crystal Facet Gradients -->
    <linearGradient id="prismFace1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#E2F8FA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#81E6D9" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="prismFace2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B2F5EA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#319795" stop-opacity="0.75" />
    </linearGradient>

    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17231B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#prismGlow)">
    <!-- White Incident Ray -->
    <line x1="8" y1="74" x2="42" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <polygon points="40,58 48,60 41,64" fill="#FFFFFF" />

    <!-- 3D Triangular Prism -->
    <!-- Front/Left Face -->
    <polygon points="56,20 28,95 72,102" fill="url(#prismFace1)" stroke="#CBD5E0" stroke-width="2" stroke-linejoin="round" />
    <!-- Right/Back Face -->
    <polygon points="56,20 72,102 96,82" fill="url(#prismFace2)" stroke="#CBD5E0" stroke-width="2" stroke-linejoin="round" />

    <!-- Crystal Apex & Facet Highlights -->
    <line x1="56" y1="20" x2="72" y2="102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="56" y1="20" x2="28" y2="95" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <circle cx="56" cy="20" r="3" fill="#FFFFFF" />

    <!-- Dispersed Rainbow Rays Emergent (Fan) -->
    <!-- Red -->
    <line x1="84" y1="88" x2="124" y2="62" stroke="#FF4D4D" stroke-width="3" stroke-linecap="round" />
    <!-- Orange -->
    <line x1="84" y1="90" x2="124" y2="69" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" />
    <!-- Yellow -->
    <line x1="84" y1="92" x2="124" y2="76" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round" />
    <!-- Green -->
    <line x1="84" y1="94" x2="124" y2="83" stroke="#66BB6A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Blue -->
    <line x1="84" y1="96" x2="124" y2="90" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" />
    <!-- Indigo/Violet -->
    <line x1="84" y1="98" x2="124" y2="97" stroke="#AB47BC" stroke-width="3" stroke-linecap="round" />

    <!-- Cute Sparkles -->
    <path d="M 68,14 Q 71,14 71,11 Q 71,14 74,14 Q 71,14 71,17 Q 71,14 68,14 Z" fill="#FFD54F" />
    <path d="M 18,50 Q 21,50 21,47 Q 21,50 24,50 Q 21,50 21,53 Q 21,50 18,50 Z" fill="#81E6D9" />
    <path d="M 112,48 Q 115,48 115,45 Q 115,48 118,48 Q 115,48 115,51 Q 115,48 112,48 Z" fill="#AB47BC" />
  </g>
</svg>
